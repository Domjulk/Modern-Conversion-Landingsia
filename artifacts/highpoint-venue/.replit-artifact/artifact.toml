kind = "web"
previewPath = "/"
title = "HighPoint Event & Conference Hall"
description = "A single-page venue website for HighPoint Event and Conference Hall in Area 11, Garki, Abuja. Visitors can explore the hall, event options, amenities, customer reviews, location, and request an inspection through WhatsApp."
version = "1.0.0"
id = "artifacts/highpoint-venue"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18716

[services.development]
run = "pnpm --filter @workspace/highpoint-venue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/highpoint-venue", "run", "build" ]
serve = "static"
publicDir = "artifacts/highpoint-venue/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18716"
BASE_PATH = "/"
